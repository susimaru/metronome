<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>硬筆書写 速書き</title>
<style>
:root{--ink:#183127;--paper:#f8f5ed;--accent:#08734b;--soft:#e3efe8;--line:#c7d8cd;--danger:#a52f2a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}main{max-width:650px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}.screen[hidden]{display:none}h1{margin:.5rem 0;font-size:2rem}h2{margin:0}.sub,.note{color:#52675b;line-height:1.6}.menu{display:grid;gap:12px;margin-top:25px}.panel{margin-top:20px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#fffdf8}.row{display:flex;gap:10px;align-items:center}.home{background:transparent;color:var(--accent);padding:8px 0;min-height:auto}button{border:0;border-radius:13px;padding:15px 16px;background:var(--ink);color:#fff;font:inherit;font-weight:700;cursor:pointer;min-height:50px}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #d78b16;outline-offset:3px}.menu button{text-align:left;font-size:1.05rem;padding:19px}.menu small{display:block;margin-top:5px;font-weight:400;opacity:.78}.secondary{background:var(--soft);color:var(--ink)}.stop{background:var(--danger)}label{display:block;margin-top:14px;font-weight:700}input[type=number]{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;background:#fff}.choice{display:flex;align-items:center;gap:8px;font-weight:400;margin:10px 0}.choice input{width:20px;height:20px;accent-color:var(--accent)}.calc{background:var(--soft);border-radius:10px;padding:10px;font-weight:700;line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.wide{grid-column:1/-1}.status{text-align:center;color:var(--accent);font-weight:700;min-height:1.6em;margin:25px 0 5px}.display{text-align:center;font:700 clamp(4.2rem,23vw,8rem)/1 ui-monospace,Consolas,monospace;letter-spacing:-.07em;font-variant-numeric:tabular-nums;margin:10px 0 22px}.kana{font:700 clamp(6rem,36vw,13rem)/1 "Hiragino Kaku Gothic ProN",sans-serif;letter-spacing:0}.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bar div{height:100%;width:0;background:var(--accent)}.center{text-align:center}
</style></head><body><main>
<section id="home" class="screen"><h1>硬筆書写 速書き</h1><p class="sub">ペース、かな、時間配分を目的別に練習できます。</p><div class="menu">
<button data-page="metro">4分メトロノーム<small>BPM または4分の目標文字数で一定ペース</small></button>
<button data-page="kana">かなトレモード<small>あ〜んを表示・発声しながら4分間</small></button>
<button data-page="free">フリーモード<small>BPMで止めるまでメトロノームを継続</small></button>
<button data-page="freeKana">フリーかなモード<small>あ〜んをBPMで無限ループ</small></button>
<button data-page="timer">タイマーモード<small>時間とBPMだけで行うインターバル練習</small></button>
<button data-page="exam">4分タイマーモード<small>黙読1分を加えられる本番形式</small></button>
</div><p class="note">開始中は対応するiPhoneブラウザの画面スリープを防止します。</p></section>

<section id="pace" class="screen" hidden><div class="row"><button class="home" data-home>← ホーム</button><h2 id="pace-title"></h2></div><div class="panel"><label class="choice"><input type="radio" name="basis" value="bpm" checked>BPMで設定する</label><label class="choice"><input type="radio" name="basis" value="chars">4分間の目標文字数で設定する</label><label for="bpm">BPM（1分あたりの合図）</label><input id="bpm" type="number" min="20" max="300" value="60" inputmode="numeric"><label for="chars">4分間の目標文字数</label><input id="chars" type="number" min="1" max="1440" value="120" inputmode="numeric"><p id="calc" class="calc"></p><div class="actions"><button id="pace-start" class="wide">開始</button><button id="pace-stop" class="stop" disabled>ストップ</button><button id="pace-reset" class="secondary">リセット</button></div></div><p id="pace-status" class="status">準備完了</p><div id="pace-display" class="display">04:00</div><div class="bar"><div id="pace-bar"></div></div><p id="pace-note" class="center note"></p></section>

<section id="freePage" class="screen" hidden><div class="row"><button class="home" data-home>← ホーム</button><h2 id="free-title"></h2></div><div class="panel"><label for="free-bpm">BPM（1分あたりの合図）</label><input id="free-bpm" type="number" min="20" max="300" value="60" inputmode="numeric"><p id="free-calc" class="calc"></p><div class="actions"><button id="free-start" class="wide">開始</button><button id="free-stop" class="stop" disabled>ストップ</button><button id="free-reset" class="secondary">リセット</button></div></div><p id="free-status" class="status">準備完了</p><div id="free-display" class="display">--:--</div><p id="free-note" class="center note"></p></section>

<section id="timerPage" class="screen" hidden><div class="row"><button class="home" data-home>← ホーム</button><h2>タイマーモード</h2></div><div class="panel"><label for="duration">タイマー時間（秒）</label><input id="duration" type="number" min="5" max="3600" value="60" inputmode="numeric"><label for="timer-bpm">BPM</label><input id="timer-bpm" type="number" min="20" max="300" value="120" inputmode="numeric"><div class="actions"><button id="timer-start" class="wide">開始</button><button id="timer-stop" class="stop" disabled>ストップ</button><button id="timer-reset" class="secondary">リセット</button></div></div><p id="timer-status" class="status">準備完了</p><div id="timer-display" class="display">01:00</div><div class="bar"><div id="timer-bar"></div></div></section>

<section id="examPage" class="screen" hidden><div class="row"><button class="home" data-home>← ホーム</button><h2>4分タイマー</h2></div><div class="panel"><label class="choice"><input id="reading" type="checkbox">開始前に黙読1分を入れる</label><p class="note">黙読後、5秒のカウントダウン（ピッ×4、ピー）から4分を始めます。</p><div class="actions"><button id="exam-start" class="wide">開始</button><button id="exam-stop" class="stop" disabled>ストップ</button><button id="exam-reset" class="secondary">リセット</button></div></div><p id="exam-status" class="status">準備完了</p><div id="exam-display" class="display">04:00</div><div class="bar"><div id="exam-bar"></div></div></section>
</main><script>
const KANA=['あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ','た','ち','つ','て','と','な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ','ま','み','む','め','も','や','ゆ','よ','ら','り','る','れ','ろ','わ','を','ん'];
let ctx,wake,run=null,raf=0,beatTimer=0,visualTimer=0,timers=[],kanaIndex=0,paceKana=false,freeKana=false;const $=id=>document.getElementById(id);const pages=['home','pace','freePage','timerPage','examPage'];
function show(id){pages.forEach(x=>$(x).hidden=x!==id)}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>open(b.dataset.page));document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{stop();show('home')});
function open(page){stop();if(page==='metro'||page==='kana'){paceKana=page==='kana';$('pace-title').textContent=paceKana?'かなトレモード':'4分メトロノーム';$('pace-note').textContent=paceKana?'合図ごとに、かなを1文字書きます。':'1音につき1文字を書く目安です。';reset('pace');show('pace')}else if(page==='free'||page==='freeKana'){freeKana=page==='freeKana';$('free-title').textContent=freeKana?'フリーかなモード':'フリーモード';$('free-note').textContent=freeKana?'あ〜んを繰り返します。':'止めるまで一定のBPMで続きます。';reset('free');show('freePage')}else{reset(page==='timer'?'timer':'exam');show(page==='timer'?'timerPage':'examPage')}}
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();return ctx}function beepAt(at,last=false){const c=audio(),o=c.createOscillator(),g=c.createGain();o.frequency.value=last?1047:880;g.gain.setValueAtTime(.001,at);g.gain.exponentialRampToValueAtTime(.13,at+.01);g.gain.exponentialRampToValueAtTime(.001,at+(last?.42:.1));o.connect(g).connect(c.destination);o.start(at);o.stop(at+(last?.45:.13))}function beep(last=false){beepAt(audio().currentTime,last)}function scheduleClicks(period,finishAt=Infinity){const c=audio(),lead=.12;let next=c.currentTime+.03;const schedule=()=>{if(!run)return;while(next<c.currentTime+lead&&next<finishAt){beepAt(next);next+=period}};schedule();beatTimer=setInterval(schedule,25)}function scheduleVisual(period,fn){const start=performance.now();let count=0;const step=()=>{if(!run)return;fn();count++;visualTimer=setTimeout(step,Math.max(0,start+count*period*1000-performance.now()))};step()}function getKyokoVoice(){const voices=speechSynthesis.getVoices();return voices.find(v=>v.name==='Kyoko')||voices.find(v=>v.name.includes('Kyoko'))||voices.find(v=>v.lang.startsWith('ja'))||null}function speak(k){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(k);u.lang='ja-JP';u.rate=.92;u.pitch=1;const voice=getKyokoVoice();if(voice)u.voice=voice;speechSynthesis.speak(u)}speechSynthesis.onvoiceschanged=()=>{}
async function awake(){if(!('wakeLock'in navigator)||wake)return;try{wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}catch(_){}}async function sleep(){if(wake){try{await wake.release()}catch(_){}wake=null}}
function clear(){cancelAnimationFrame(raf);clearInterval(beatTimer);clearTimeout(visualTimer);timers.forEach(clearTimeout);timers=[];if('speechSynthesis'in window)speechSynthesis.cancel()}function btn(prefix,on){$(`${prefix}-start`).disabled=on;$(`${prefix}-stop`).disabled=!on}function time(sec){sec=Math.max(0,Math.ceil(sec));return`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}function stop(msg='中断しました'){if(!run)return;clear();btn(run,false);$(`${run}-status`).textContent=msg;run=null;sleep()}
function reset(which){stop();if(which==='pace'){$('pace-display').textContent='04:00';$('pace-bar').style.width='0%';$('pace-status').textContent='準備完了'}if(which==='free'){$('free-display').textContent='--:--';$('free-status').textContent='準備完了'}if(which==='timer'){$('timer-display').textContent=time(+$('duration').value||60);$('timer-bar').style.width='0%';$('timer-status').textContent='準備完了'}if(which==='exam'){$('exam-display').textContent='04:00';$('exam-bar').style.width='0%';$('exam-status').textContent='準備完了'}}
function interval(){const by=document.querySelector('input[name=basis]:checked').value==='bpm',b=Math.max(20,Math.min(300,+$('bpm').value||60)),n=Math.max(1,Math.min(1440,+$('chars').value||120)),s=by?60/b:240/n;$('calc').textContent=by?`1文字 ${s.toFixed(2)}秒ごと ／ 4分で約${Math.round(240/s)}文字`:`1文字 ${s.toFixed(2)}秒ごと ／ 1分あたり${(60/s).toFixed(1)}文字`;return s}function freeInterval(){const b=Math.max(20,Math.min(300,+$('free-bpm').value||60)),s=60/b;$('free-calc').textContent=`1文字 ${s.toFixed(2)}秒ごと`;return s}
function kanaBeat(target){const k=KANA[kanaIndex++%KANA.length];$(target).textContent=k;speak(k)}
function finite(prefix,seconds,clickPeriod=0,visualPeriod=0,visualFn=null,finishSound=true){const start=performance.now(),finishAt=audio().currentTime+seconds;$(prefix+'-status').textContent='実行中';function draw(n){if(run!==prefix)return;const e=Math.min(seconds,(n-start)/1000);$(prefix+'-display').textContent=time(seconds-e);$(prefix+'-bar').style.width=`${e/seconds*100}%`;if(e>=seconds){clearInterval(beatTimer);clearTimeout(visualTimer);btn(prefix,false);$(prefix+'-status').textContent='終了！';if(finishSound)beep(true);run=null;sleep();return}raf=requestAnimationFrame(draw)}if(clickPeriod)scheduleClicks(clickPeriod,finishAt);if(visualPeriod&&visualFn)scheduleVisual(visualPeriod,visualFn);raf=requestAnimationFrame(draw)}
function startPace(){const s=interval();run='pace';kanaIndex=0;btn('pace',true);awake();if(paceKana)finite('pace',240,0,s,()=>kanaBeat('pace-display'),false);else finite('pace',240,s)}function startFree(){const s=freeInterval();run='free';kanaIndex=0;btn('free',true);awake();$('free-status').textContent='実行中';if(freeKana)scheduleVisual(s,()=>kanaBeat('free-display'));else scheduleClicks(s)}function startTimer(){const d=Math.max(5,Math.min(3600,+$('duration').value||60)),s=60/Math.max(20,Math.min(300,+$('timer-bpm').value||120));run='timer';btn('timer',true);awake();finite('timer',d,s)}
function countdown(sec,title,done){const start=performance.now();$('exam-status').textContent=title;function draw(n){if(run!=='exam')return;const left=sec-(n-start)/1000;$('exam-display').textContent=time(left);if(left<=0)return done();raf=requestAnimationFrame(draw)}raf=requestAnimationFrame(draw)}function startExam(){run='exam';btn('exam',true);awake();if(!$('reading').checked)return finite('exam',240,0,null);countdown(60,'黙読 1分',()=>{let i=0;const f=()=>{i++;beep(i===5);if(i<5)timers.push(setTimeout(f,1000));else timers.push(setTimeout(()=>finite('exam',240,0,null),1000))};f();countdown(5,'カウントダウン',()=>{})})}
$('pace-start').onclick=startPace;$('pace-stop').onclick=()=>stop();$('pace-reset').onclick=()=>reset('pace');$('free-start').onclick=startFree;$('free-stop').onclick=()=>stop();$('free-reset').onclick=()=>reset('free');$('timer-start').onclick=startTimer;$('timer-stop').onclick=()=>stop();$('timer-reset').onclick=()=>reset('timer');$('exam-start').onclick=startExam;$('exam-stop').onclick=()=>stop();$('exam-reset').onclick=()=>reset('exam');$('bpm').oninput=interval;$('chars').oninput=interval;document.querySelectorAll('input[name=basis]').forEach(x=>x.onchange=interval);$('free-bpm').oninput=freeInterval;$('duration').oninput=()=>reset('timer');interval();freeInterval();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&run)awake()});
</script></body></html>
